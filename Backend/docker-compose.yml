services:

  # MySQL database
  mysql:
    image: mysql:8.0
    container_name: healthcare-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Prateek1234@+
      MYSQL_DATABASE: smarthealthcare_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Spring Boot backend
  backend:
    build: .
    container_name: healthcare-backend
    ports:
      - "8081:8081"
    environment:
      spring.datasource.url: jdbc:mysql://mysql:3306/smarthealthcare_db
      spring.datasource.username: root
      spring.datasource.password: Prateek1234@+
      jwt.secret: mySecretKey12345678901234567890AB
      jwt.expiration: 86400000
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data: